<script>
(function () {
	var KEY = 'pr-inst-never';
	var deferred = null;
	function bar() { return document.getElementById('pr-inst'); }
	function hide() { var d = bar(); if (d) d.classList.remove('on'); }
	/* de echte installatievraag van de browser (alleen na een tik) */
	function ask() {
		hide();
		if (!deferred) return;
		var e = deferred;
		deferred = null;
		e.prompt();
		if (e.userChoice) e.userChoice.then(function (c) { if (c && c.outcome === 'accepted') { try { localStorage.setItem(KEY, '1'); } catch (x) {} } });
	}
	function show() {
		var d = bar();
		if (!d) {
			d = document.createElement('div');
			d.id = 'pr-inst';
			d.innerHTML = '<img src=\"index.192x192.png\" alt=\"\">'
				+ '<div class=\"t\"><b>Installeer Parkstad Racer</b>Als app: over het hele scherm en ook zonder internet.</div>'
				+ '<button class=\"ok\" type=\"button\">Installeren</button><button class=\"no\" type=\"button\">Nee</button>';
			document.body.appendChild(d);
			d.querySelector('.ok').onclick = ask;
			d.querySelector('.no').onclick = function () {
				try { localStorage.setItem(KEY, '1'); } catch (x) {}
				hide();
			};
		}
		d.classList.add('on');
	}
	window.addEventListener('beforeinstallprompt', function (e) {
		/* alleen op Android; op de computer laat Chrome het installeren zelf zien */
		if (!/Android/i.test(navigator.userAgent || '')) return;
		e.preventDefault();
		deferred = e;
		var never = false;
		try { never = localStorage.getItem(KEY) === '1'; } catch (x) {}
		if (!never) setTimeout(show, 1200);
	});
	window.addEventListener('appinstalled', function () { deferred = null; hide(); });
	/* voor de knop bij Instellingen: kan de browser het spel nu installeren? */
	window.parkstadCanInstallApp = function () { return deferred !== null; };
	window.parkstadInstallApp = ask;
})();
</script>
<script>
/* Probleemrapporten: technische gegevens (browser, grafische chip, hoe ver het laden is, de laatste foutmeldingen) naar de server van het spel. Geen naam of andere persoonlijke gegevens. Vanzelf als het laden vastloopt, de grafische verbinding wegvalt of er een scriptfout is; met de hand via Instellingen. */
(function () {
	var SERVER = 'https://parkstad-racer-mp.cliffwings.workers.dev';
	var t0 = Date.now();
	var log = [];
	var sent = {};
	var stage = 'pagina';
	var since = t0;
	function add(kind, args) {
		try {
			var t = Array.prototype.map.call(args, function (x) { return String(x); }).join(' ');
			if (t.length > 300) t = t.slice(0, 300);
			log.push(Math.round((Date.now() - t0) / 1000) + 's ' + kind + ': ' + t);
			if (log.length > 40) log.shift();
		} catch (e) {}
	}
	['error', 'warn'].forEach(function (k) {
		var orig = console[k];
		console[k] = function () {
			add(k, arguments);
			if (k === 'error' && String(arguments[0]).indexOf('SCRIPT ERROR') >= 0) later('scriptfout');
			return orig.apply(console, arguments);
		};
	});
	window.addEventListener('error', function (e) { add('onerror', [e.message + ' @' + (e.filename || '') + ':' + (e.lineno || '')]); });
	window.addEventListener('unhandledrejection', function (e) { add('promise', [e.reason]); });
	var gpu = null;
	function gpuName() {
		if (gpu !== null) return gpu;
		gpu = '';
		try {
			var c = document.createElement('canvas');
			var g = c.getContext('webgl2') || c.getContext('webgl');
			if (g) {
				var x = g.getExtension('WEBGL_debug_renderer_info');
				gpu = String(x ? g.getParameter(x.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER));
				var lc = g.getExtension('WEBGL_lose_context');
				if (lc) lc.loseContext();
			}
		} catch (e) {}
		return gpu;
	}
	function info(kind, note) {
		var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
		return {
			kind: kind, note: note || '', version: window.parkstadVersion || '',
			stage: stage, stage_s: Math.round((Date.now() - since) / 1000), uptime_s: Math.round((Date.now() - t0) / 1000),
			ua: navigator.userAgent, gpu: gpuName(), screen: screen.width + 'x' + screen.height, window: window.innerWidth + 'x' + window.innerHeight,
			dpr: window.devicePixelRatio || 1, memory_gb: navigator.deviceMemory || 0, cores: navigator.hardwareConcurrency || 0,
			standalone: !!standalone, fps: window.parkstadFps || 0, log: log.slice()
		};
	}
	function send(kind, note, beacon) {
		var body = JSON.stringify(info(kind, note));
		try {
			if (beacon && navigator.sendBeacon) {
				navigator.sendBeacon(SERVER + '/report', new Blob([body], { type: 'text/plain' }));
				return;
			}
			fetch(SERVER + '/report', { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' }, keepalive: true }).catch(function () {});
		} catch (e) {}
	}
	/* vanzelf: elk soort probleem één keer per bezoek */
	function once(kind, beacon) {
		if (sent[kind]) return;
		sent[kind] = true;
		send(kind, '', beacon);
	}
	function later(kind) { setTimeout(function () { once(kind, false); }, 2000); }
	/* het spel meldt waar het is: 'menu', 'laden: verkeer', 'race: Heerlen' ... */
	window.parkstadStage = function (n) { stage = String(n); since = Date.now(); };
	window.parkstadReport = function (note) { send('handmatig', note, false); };
	document.addEventListener('webglcontextlost', function () { add('webgl', ['context lost in ' + stage]); once('webgl_weg', true); }, true);
	setInterval(function () {
		if (stage.indexOf('laden') === 0 && Date.now() - since > 60000) once('laden_traag', false);
	}, 5000);
	/* weg tijdens het laden (opgegeven?): nog snel een rapport */
	window.addEventListener('pagehide', function () {
		if (stage.indexOf('laden') === 0 && Date.now() - since > 15000) once('laden_afgebroken', true);
	});
})();
</script>
<script>
/* Statistieken (anoniem): het spel meldt 'open', 'race_start' en 'race_end' (zie Game.web_event). Mee gaan alleen een willekeurig apparaatnummer (in de opslag van de browser), het soort apparaat en de browser, of het spel vanaf het beginscherm draait en wat er in de race gebeurt. Geen naam en geen IP-adres. Niet op localhost (tenzij ?stats=1). */
(function () {
	var SERVER = 'https://parkstad-racer-mp.cliffwings.workers.dev';
	var local = /^(localhost|127\\.0\\.0\\.1)$/.test(location.hostname) && location.search.indexOf('stats=1') < 0;
	var vid = '';
	try {
		vid = localStorage.getItem('pr-vid') || '';
		if (!vid) {
			vid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2) + String(Date.now());
			localStorage.setItem('pr-vid', vid);
		}
	} catch (e) {}
	function device() {
		var u = navigator.userAgent || '';
		if (/Android/i.test(u)) return 'android';
		if (/iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ipad';
		if (/iPhone|iPod/.test(u)) return 'iphone';
		return 'computer';
	}
	function browser() {
		var u = navigator.userAgent || '';
		if (/SamsungBrowser/.test(u)) return 'Samsung Internet';
		if (/Edg/.test(u)) return 'Edge';
		if (/FxiOS|Firefox/.test(u)) return 'Firefox';
		if (/CriOS|Chrome\\//.test(u)) return 'Chrome';
		if (/Safari/.test(u)) return 'Safari';
		return 'anders';
	}
	/* de echte grafische chip, uit de verbinding die het spel al heeft (Godot zelf geeft in de
	   browser alleen 'WebKit WebGL' door) */
	var gpu = null;
	function gpuName() {
		if (gpu) return gpu;
		try {
			var c = document.getElementById('canvas');
			var g = c && c.getContext('webgl2');
			if (g) {
				var x = g.getExtension('WEBGL_debug_renderer_info');
				gpu = String(x ? g.getParameter(x.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER)).slice(0, 60);
			}
		} catch (e) {}
		return gpu || '';
	}
	window.parkstadEvent = function (kind, data) {
		if (local) return;
		try {
			var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
			var b = { e: kind, vid: vid, v: window.parkstadVersion || '', dev: device(), br: browser(), app: standalone ? 1 : 0 };
