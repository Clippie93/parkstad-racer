<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-title\" content=\"Parkstad Racer\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"theme-color\" content=\"#101722\">
<script>/* Geluid: de stille modus van de telefoon wordt gerespecteerd (geen audioSession-truc). Gaat de pagina naar de achtergrond of wordt hij gesloten, dan wordt het geluid gepauzeerd en bij terugkomst hervat. Daarvoor onthouden we elke AudioContext die Godot maakt. */(function(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var list=[];function W(o){var c=new AC(o);list.push(c);return c;}W.prototype=AC.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;function upd(){var hid=document.visibilityState==='hidden';list.forEach(function(c){try{if(hid){c.suspend();}else if(c.state==='suspended'){c.resume();}}catch(e){}});}document.addEventListener('visibilitychange',upd);window.addEventListener('pagehide',function(){list.forEach(function(c){try{c.suspend();}catch(e){}});});window.addEventListener('pageshow',upd);})();</script><script>/* Parkstad Racer: index.wasm staat gecomprimeerd online (index.wasm.gz, onder de 25 MB-limiet van Cloudflare). Pakt hem hier in de browser uit; staat er geen .gz, dan gewoon de normale index.wasm. */(function(){var f=window.fetch;window.fetch=function(u,o){var s=(typeof u==='string')?u:(u&&u.url)||'';if(/index\\.wasm(\\?|$)/.test(s)&&typeof DecompressionStream!=='undefined'){return f(s.replace(/index\\.wasm/,'index.wasm.gz'),o).then(function(r){if(!r.ok)return f(u,o);return new Response(r.body.pipeThrough(new DecompressionStream('gzip')),{status:200,headers:{'Content-Type':'application/wasm'}});});}return f(u,o);};})();</script>
<script>/* PWA: service worker voor snel laden en offline spelen. Staat er een nieuwe versie klaar, dan neemt die meteen over (de pagina laadt dan één keer opnieuw). */
if ('serviceWorker' in navigator) {
	window.addEventListener('load', function () {
		navigator.serviceWorker.register('index.service.worker.js').then(function (r) {
			var take = function (w) { if (w && navigator.serviceWorker.controller) { w.postMessage('update'); } };
			take(r.waiting);
			r.addEventListener('updatefound', function () {
				var w = r.installing;
				w.addEventListener('statechange', function () { if (w.state == 'installed') { take(w); } });
			});
		}).catch(function (e) { console.warn('service worker', e); });
	});
}
</script>
<style>
/* Parkstad Racer: pagina staat vast, zodat iOS na het draaien niet half verschoven blijft staan */
html, body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
/* Veilig gebied (iPhone: Dynamic Island, ronde hoeken); het spel leest dit uit (screen_fit.gd) */
:root { --pr-sal: env(safe-area-inset-left); --pr-sat: env(safe-area-inset-top); --pr-sar: env(safe-area-inset-right); --pr-sab: env(safe-area-inset-bottom); }
#canvas { position: fixed; top: 0; left: 0; }
/* Draai-je-telefoon-scherm: alleen op aanraakschermen in portretstand */
#pr-rotate { display: none; position: fixed; inset: 0; z-index: 1000; background: #111723; color: #fff; font-family: -apple-system, system-ui, sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; box-sizing: border-box; }
@media (orientation: portrait) and (pointer: coarse) { #pr-rotate { display: flex; } }
#pr-rotate h1 { margin: 0; font-size: 30px; color: #f3df68; letter-spacing: 1px; }
#pr-rotate p { margin: 0; font-size: 18px; color: #c9d0d6; line-height: 1.4; max-width: 300px; }
#pr-rotate svg { width: 170px; height: 170px; overflow: visible; }
#pr-phone { transform-origin: 85px 85px; animation: pr-turn 2.6s ease-in-out infinite; }
#pr-arrow { animation: pr-fade 2.6s ease-in-out infinite; }
@keyframes pr-turn { 0%, 25% { transform: rotate(0deg); } 55%, 85% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
@keyframes pr-fade { 0%, 15% { opacity: 1; } 45%, 90% { opacity: 0; } 100% { opacity: 1; } }
</style>
<script>
(function () {
	/* scherm met uitleg om de telefoon te draaien */
	function add() {
		if (document.getElementById('pr-rotate')) return;
		var d = document.createElement('div');
		d.id = 'pr-rotate';
		d.innerHTML = '<svg viewBox=\"0 0 170 170\" aria-hidden=\"true\">'
			+ '<g id=\"pr-arrow\" fill=\"none\" stroke=\"#f3df68\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M72 11 A75 75 0 0 1 159 72\"/><path d=\"M147 65 L159 75 L167 61\"/></g>'
			+ '<g id=\"pr-phone\"><rect x=\"55\" y=\"25\" width=\"60\" height=\"120\" rx=\"12\" fill=\"#1d2534\" stroke=\"#fff\" stroke-width=\"5\"/>'
			+ '<rect x=\"62\" y=\"38\" width=\"46\" height=\"94\" rx=\"4\" fill=\"#2a3344\"/>'
			+ '<rect x=\"74\" y=\"31\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#fff\"/></g></svg>'
			+ '<h1>DRAAI JE TELEFOON</h1>'
			+ '<p>Parkstad Racer speel je liggend. Zet je telefoon dwars en zet de draaivergrendeling uit als het scherm niet meedraait.</p>';
		document.body.appendChild(d);
	}
	if (document.body) add(); else document.addEventListener('DOMContentLoaded', add);
	/* na het draaien: terug naar boven en de maat nog een paar keer opnieuw laten bepalen,
	   want iOS geeft de nieuwe schermgrootte soms pas later door */
	function fix() {
		window.scrollTo(0, 0);
		if (document.documentElement) document.documentElement.scrollTop = 0;
		if (document.body) document.body.scrollTop = 0;
	}
	function later() {
		fix();
		[100, 300, 600, 1000].forEach(function (t) {
			setTimeout(function () { fix(); window.dispatchEvent(new Event('resize')); }, t);
		});
	}
	window.addEventListener('orientationchange', later);
	if (window.visualViewport) window.visualViewport.addEventListener('resize', fix);
	window.addEventListener('scroll', fix);
	window.addEventListener('pageshow', later);
})();
</script>
<style>
/* Uitleg \"Zet op beginscherm\", alleen voor iPhone/iPad (Android biedt zelf installeren aan) */
#pr-a2hs { display: none; position: fixed; inset: 0; z-index: 1001; background: rgba(10,14,22,0.97); color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow-y: auto; -webkit-overflow-scrolling: touch; box-sizing: border-box; padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
#pr-a2hs.on { display: flex; }
#pr-a2hs .in { margin: auto; display: flex; gap: 28px; align-items: center; max-width: 820px; width: 100%; }
#pr-a2hs .intro { flex: 0 0 34%; }
#pr-a2hs h1 { margin: 0 0 10px; font-size: 26px; color: #f3df68; letter-spacing: 1px; line-height: 1.15; }
#pr-a2hs .intro p { margin: 0; font-size: 16px; color: #c9d0d6; line-height: 1.4; }
#pr-a2hs ol { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
#pr-a2hs li { display: flex; align-items: center; gap: 14px; background: #1b2332; border-radius: 12px; padding: 10px 14px; font-size: 16px; line-height: 1.35; color: #e6eaee; }
#pr-a2hs li b { color: #fff; }
#pr-a2hs li small { display: block; color: #9aa3ab; font-size: 14px; margin-top: 2px; }
#pr-a2hs .n { flex: 0 0 30px; height: 30px; border-radius: 15px; background: #f3df68; color: #111723; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 17px; }
#pr-a2hs .ic { flex: 0 0 34px; width: 34px; height: 34px; }
#pr-a2hs .btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
#pr-a2hs button { font: inherit; font-size: 16px; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
#pr-a2hs .ok { background: #f3df68; color: #111723; font-weight: 700; }
#pr-a2hs .never { background: #2a3344; color: #c9d0d6; }
@media (orientation: portrait) { #pr-a2hs .in { flex-direction: column; align-items: stretch; gap: 18px; } #pr-a2hs .intro { flex: none; } }
</style>
<script>
(function () {
	var KEY = 'pr-a2hs-never';
	function isIOS() {
		var u = navigator.userAgent || '';
		return /iPhone|iPad|iPod/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	}
	function standalone() {
		return navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
	}
	var SHARE = '<svg class=\"ic\" viewBox=\"0 0 34 34\" fill=\"none\" stroke=\"#5aa9ff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 13H9.5a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 9.5 30h15a1.5 1.5 0 0 0 1.5-1.5v-14a1.5 1.5 0 0 0-1.5-1.5H22\"/><path d=\"M17 21V4\"/><path d=\"M11.5 9.5 17 4l5.5 5.5\"/></svg>';
	var ADD = '<svg class=\"ic\" viewBox=\"0 0 34 34\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><rect x=\"5\" y=\"5\" width=\"24\" height=\"24\" rx=\"6\"/><path d=\"M17 11v12M11 17h12\"/></svg>';
	var DONE = '<svg class=\"ic\" viewBox=\"0 0 34 34\" fill=\"none\" stroke=\"#5aa9ff\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 18l6.5 6.5L27 10\"/></svg>';
	function steps() {
		var u = navigator.userAgent || '';
		var first;
		if (/CriOS|EdgiOS/.test(u)) {
			first = 'Tik bovenin naast het adres op de <b>deelknop</b>.';
		} else if (/FxiOS/.test(u)) {
			first = 'Tik op het <b>menu</b> en dan op <b>Deel</b>.';
		} else {
			first = 'Tik op de <b>deelknop</b>.<small>Zie je die niet? Tik dan eerst op <b>&bull;&bull;&bull;</b> naast het adres en daarna op <b>Deel</b>.</small>';
		}
		return '<li><span class=\"n\">1</span>' + SHARE + '<span>' + first + '</span></li>'
			+ '<li><span class=\"n\">2</span>' + ADD + '<span>Scroll omlaag en tik op <b>Zet op beginscherm</b>.<small>Staat het er niet bij? Tik dan eerst op <b>Meer</b>.</small></span></li>'
			+ '<li><span class=\"n\">3</span>' + DONE + '<span>Tik rechtsboven op <b>Voeg toe</b>.<small>Start het spel voortaan met het icoon op je beginscherm.</small></span></li>';
	}
	function hide() {
		var d = document.getElementById('pr-a2hs');
		if (d) d.classList.remove('on');
	}
	function show() {
		var d = document.getElementById('pr-a2hs');
		if (!d) {
			d = document.createElement('div');
			d.id = 'pr-a2hs';
			document.body.appendChild(d);
		}
		d.innerHTML = '<div class=\"in\"><div class=\"intro\"><h1>ZET HET SPEL OP JE BEGINSCHERM</h1>'
			+ '<p>Dan speel je over het hele scherm, zonder adresbalk, en start het sneller. Het werkt daarna ook zonder internet.</p>'
			+ '<div class=\"btns\"><button class=\"ok\" type=\"button\">Begrepen</button><button class=\"never\" type=\"button\">Niet meer tonen</button></div></div>'
			+ '<ol>' + steps() + '</ol></div>';
		d.querySelector('.ok').onclick = hide;
		d.querySelector('.never').onclick = function () {
			try { localStorage.setItem(KEY, '1'); } catch (e) {}
			hide();
		};
		d.classList.add('on');
	}
	/* het spel vraagt dit op voor de knop bij Instellingen */
	window.parkstadCanInstall = function () { return isIOS() && !standalone(); };
	window.parkstadShowInstall = show;
	function auto() {
		if (!window.parkstadCanInstall()) return;
		var never = false;
		try { never = localStorage.getItem(KEY) === '1'; } catch (e) {}
		if (!never) setTimeout(show, 1200);
	}
	if (document.body) auto(); else document.addEventListener('DOMContentLoaded', auto);
})();
</script>
<style>
/* Android (Chrome e.d.): balkje onderin om het spel als app te installeren */
#pr-inst { display: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 1001; width: min(560px, calc(100% - 24px)); box-sizing: border-box; background: #1b2332; color: #fff; font-family: system-ui, -apple-system, sans-serif; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); padding: 12px 14px; align-items: center; gap: 12px; }
#pr-inst.on { display: flex; }
#pr-inst img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
#pr-inst .t { flex: 1; font-size: 15px; line-height: 1.3; color: #c9d0d6; }
#pr-inst .t b { display: block; color: #f3df68; font-size: 16px; }
#pr-inst button { font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; flex: none; }
#pr-inst .ok { background: #f3df68; color: #111723; font-weight: 700; }
#pr-inst .no { background: #2a3344; color: #c9d0d6; }
</style>
<script>
(function () {
	var KEY = 'pr-inst-never';
	var deferred = null;
	function bar() { return document.getElementById('pr-inst'); }
	function hide() { var d = bar(); if (d) d.classList.remove('on'); }
	/* de echte installatievraag van de browser (alleen na een tik) */
	function ask() {
		hide();
		if (!deferred) return;
		var e = deferred;
		deferred = null;
		e.prompt();
		if (e.userChoice) e.userChoice.then(function (c) { if (c && c.outcome === 'accepted') { try { localStorage.setItem(KEY, '1'); } catch (x) {} } });
	}
	function show() {
		var d = bar();
		if (!d) {
			d = document.createElement('div');
			d.id = 'pr-inst';
			d.innerHTML = '<img src=\"index.192x192.png\" alt=\"\">'
				+ '<div class=\"t\"><b>Installeer Parkstad Racer</b>Als app: over het hele scherm en ook zonder internet.</div>'
				+ '<button class=\"ok\" type=\"button\">Installeren</button><button class=\"no\" type=\"button\">Nee</button>';
			document.body.appendChild(d);
			d.querySelector('.ok').onclick = ask;
			d.querySelector('.no').onclick = function () {
				try { localStorage.setItem(KEY, '1'); } catch (x) {}
				hide();
			};
		}
		d.classList.add('on');
	}
	window.addEventListener('beforeinstallprompt', function (e) {
		/* alleen op Android; op de computer laat Chrome het installeren zelf zien */
		if (!/Android/i.test(navigator.userAgent || '')) return;
		e.preventDefault();
		deferred = e;
		var never = false;
		try { never = localStorage.getItem(KEY) === '1'; } catch (x) {}
		if (!never) setTimeout(show, 1200);
	});
	window.addEventListener('appinstalled', function () { deferred = null; hide(); });
	/* voor de knop bij Instellingen: kan de browser het spel nu installeren? */
	window.parkstadCanInstallApp = function () { return deferred !== null; };
	window.parkstadInstallApp = ask;
})();
</script>"
