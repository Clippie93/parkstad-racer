html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-title\" content=\"Parkstad Racer\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"theme-color\" content=\"#101722\">
<script>/* Geluid: de stille modus van de telefoon wordt gerespecteerd (geen audioSession-truc). Gaat de pagina naar de achtergrond of wordt hij gesloten, dan wordt het geluid gepauzeerd en bij terugkomst hervat. Daarvoor onthouden we elke AudioContext die Godot maakt. */(function(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var list=[];function W(o){var c=new AC(o);list.push(c);return c;}W.prototype=AC.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;function upd(){var hid=document.visibilityState==='hidden';list.forEach(function(c){try{if(hid){c.suspend();}else if(c.state==='suspended'){c.resume();}}catch(e){}});}document.addEventListener('visibilitychange',upd);window.addEventListener('pagehide',function(){list.forEach(function(c){try{c.suspend();}catch(e){}});});window.addEventListener('pageshow',upd);})();</script><script>/* Parkstad Racer: index.wasm staat gecomprimeerd online (index.wasm.gz, onder de 25 MB-limiet van Cloudflare). Pakt hem hier in de browser uit; staat er geen .gz, dan gewoon de normale index.wasm. */(function(){var f=window.fetch;window.fetch=function(u,o){var s=(typeof u==='string')?u:(u&&u.url)||'';if(/index\\.wasm(\\?|$)/.test(s)&&typeof DecompressionStream!=='undefined'){return f(s.replace(/index\\.wasm/,'index.wasm.gz'),o).then(function(r){if(!r.ok)return f(u,o);return new Response(r.body.pipeThrough(new DecompressionStream('gzip')),{status:200,headers:{'Content-Type':'application/wasm'}});});}return f(u,o);};})();</script>
<script>/* PWA: service worker voor snel laden en offline spelen. Staat er een nieuwe versie klaar, dan neemt die meteen over (de pagina laadt dan één keer opnieuw). */
if ('serviceWorker' in navigator) {
	window.addEventListener('load', function () {
		navigator.serviceWorker.register('index.service.worker.js').then(function (r) {
			var take = function (w) { if (w && navigator.serviceWorker.controller) { w.postMessage('update'); } };
			take(r.waiting);
			r.addEventListener('updatefound', function () {
				var w = r.installing;
				w.addEventListener('statechange', function () { if (w.state == 'installed') { take(w); } });
			});
		}).catch(function (e) { console.warn('service worker', e); });
	});
}
</script>
<style>
/* Parkstad Racer: pagina staat vast, zodat iOS na het draaien niet half verschoven blijft staan */
html, body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
/* Veilig gebied (iPhone: Dynamic Island, ronde hoeken); het spel leest dit uit (screen_fit.gd) */
:root { --pr-sal: env(safe-area-inset-left); --pr-sat: env(safe-area-inset-top); --pr-sar: env(safe-area-inset-right); --pr-sab: env(safe-area-inset-bottom); }
#canvas { position: fixed; top: 0; left: 0; }
/* Draai-je-telefoon-scherm: alleen op aanraakschermen in portretstand */
#pr-rotate { display: none; position: fixed; inset: 0; z-index: 1000; background: #111723; color: #fff; font-family: -apple-system, system-ui, sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; box-sizing: border-box; }
@media (orientation: portrait) and (pointer: coarse) { #pr-rotate { display: flex; } }
#pr-rotate h1 { margin: 0; font-size: 30px; color: #f3df68; letter-spacing: 1px; }
#pr-rotate p { margin: 0; font-size: 18px; color: #c9d0d6; line-height: 1.4; max-width: 300px; }
#pr-rotate svg { width: 170px; height: 170px; overflow: visible; }
#pr-phone { transform-origin: 85px 85px; animation: pr-turn 2.6s ease-in-out infinite; }
#pr-arrow { animation: pr-fade 2.6s ease-in-out infinite; }
@keyframes pr-turn { 0%, 25% { transform: rotate(0deg); } 55%, 85% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
@keyframes pr-fade { 0%, 15% { opacity: 1; } 45%, 90% { opacity: 0; } 100% { opacity: 1; } }
</style>
<script>
(function () {
	/* scherm met uitleg om de telefoon te draaien */
	function add() {
		if (document.getElementById('pr-rotate')) return;
		var d = document.createElement('div');
		d.id = 'pr-rotate';
		d.innerHTML = '<svg viewBox=\"0 0 170 170\" aria-hidden=\"true\">'
			+ '<g id=\"pr-arrow\" fill=\"none\" stroke=\"#f3df68\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M72 11 A75 75 0 0 1 159 72\"/><path d=\"M147 65 L159 75 L167 61\"/></g>'
			+ '<g id=\"pr-phone\"><rect x=\"55\" y=\"25\" width=\"60\" height=\"120\" rx=\"12\" fill=\"#1d2534\" stroke=\"#fff\" stroke-width=\"5\"/>'
			+ '<rect x=\"62\" y=\"38\" width=\"46\" height=\"94\" rx=\"4\" fill=\"#2a3344\"/>'
			+ '<rect x=\"74\" y=\"31\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#fff\"/></g></svg>'
			+ '<h1>DRAAI JE TELEFOON</h1>'
			+ '<p>Parkstad Racer speel je liggend. Zet je telefoon dwars en zet de draaivergrendeling uit als het scherm niet meedraait.</p>';
		document.body.appendChild(d);
	}
	if (document.body) add(); else document.addEventListener('DOMContentLoaded', add);
	/* na het draaien: terug naar boven en de maat nog een paar keer opnieuw laten bepalen,
	   want iOS geeft de nieuwe schermgrootte soms pas later door */
	function fix() {
		window.scrollTo(0, 0);
		if (document.documentElement) document.documentElement.scrollTop = 0;
		if (document.body) document.body.scrollTop = 0;
	}
	function later() {
		fix();
		[100, 300, 600, 1000].forEach(function (t) {
			setTimeout(function () { fix(); window.dispatchEvent(new Event('resize')); }, t);
		});
	}
	window.addEventListener('orientationchange', later);
	if (window.visualViewport) window.visualViewport.addEventListener('resize', fix);
	window.addEventListener('scroll', fix);
	window.addEventListener('pageshow', later);
})();
</script>"
