# Multiplayer-server van Parkstad Racer: een Worker die kamercodes uitdeelt en per kamer
# een Durable Object dat de berichten tussen de spelers doorstuurt (zie MULTIPLAYER_PLAN.md).
name = "parkstad-racer-mp"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# statistieken: anonieme gebeurtenissen van het spel (zie /event en /stats)
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

# probleemrapporten van het spel (zie /report in src/index.js); lezen met tools/reports.sh
[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

# SQLite-opslag: dat is wat het gratis plan van Cloudflare toestaat
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reports"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Stats"]

# de statistiekenpagina (src/dashboard.html) gaat als tekst mee in de Worker
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
